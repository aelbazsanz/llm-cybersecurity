[project]
name = "lab01-llm01-direct-prompt-injection"
version = "0.1.0"
description = "Hands-on laboratory for OWASP LLM01:2025 Direct Prompt Injection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
"httpx>=0.27,<1.0",
]

[dependency-groups]
dev = [
"pytest>=8.0,<9.0",
]

[project.scripts]
lab01 = "lab01.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab01"]
